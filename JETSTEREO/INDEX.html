<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jetstereo | Tecnología para tu vida</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
    }
    header {
      background-color: #005baa;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background-color: #003f7d;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 15px;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .banner {
      background-image: url('https://jetstereo.com/images/banner/BANNER_WEB_CELULARES_1_1692644227.jpg');
      background-size: cover;
      background-position: center;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2em;
      text-shadow: 2px 2px 6px #000;
      text-align: center;
    }
    section {
      padding: 40px 20px;
    }
    .productos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .producto {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 250px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .producto img {
      width: 100%;
      border-radius: 5px;
    }
    .producto h3 {
      margin: 15px 0 10px;
    }
    .producto p {
      color: green;
      font-weight: bold;
      font-size: 1.1em;
    }
    .contacto {
      background: white;
      max-width: 600px;
      margin: auto;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .contacto form {
      display: flex;
      flex-direction: column;
    }
    .contacto label {
      margin-top: 15px;
      font-weight: bold;
    }
    .contacto input, .contacto textarea {
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    .contacto button {
      margin-top: 20px;
      background: #005baa;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
    }
    footer {
      background-color: #003f7d;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Jetstereo</h1>
    <p>Tu mundo en tecnología</p>
  </header>

  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#productos">Productos</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <section id="inicio" class="banner">
    ¡Ofertas especiales en tecnología todo el año!
  </section>

  <section id="productos">
    <h2 style="text-align:center; color:#003f7d;">Productos Destacados</h2>
    <div class="productos">
      <div class="producto">
        <img src="pantalla-smart-uhd-4k-samsung-65-un65du7000pxp-191360_2_.webp" alt="TV Samsung">
        <h3>TV Samsung 65" 4K</h3>
        <p>$699.99</p>
      </div>
      <div class="producto">
        <img src="descarga (20).jpg" alt="Laptop HP">
        <h3>Laptop HP 15.6”</h3>
        <p>$429.99</p>
      </div>
      <div class="producto">
        <img src="descarga (19).jpg" alt="iPad 10.9">
        <h3>iPad 10.9” 64GB</h3>
        <p>$549.99</p>
      </div>
      <div class="producto">
        <img src="descarga (21).jpg" alt="PlayStation 5">
        <h3>PlayStation 5</h3>
        <p>$499.99</p>
      </div>
    </div>
  </section>

  <section id="contacto">
    <h2 style="text-align:center; color:#003f7d;">Contáctanos</h2>
    <div class="contacto">
      <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <button type="submit">Enviar mensaje</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Jetstereo. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
